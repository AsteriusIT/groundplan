# Serves the built documentation site. TLS is handled by the Caddy edge
# (infra/caddy/Caddyfile); this server only serves static files. No SPA
# fallback: the docs are real pages, so unknown paths are honest 404s —
# Starlight builds one at /404.html.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Astro writes content-hashed assets to /_astro — cache them hard.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Pagefind's search index is content-hashed by filename too, but it is
    # fetched on demand rather than referenced from the HTML, so a stale copy
    # would silently answer with yesterday's pages. A short cache is enough.
    location /pagefind/ {
        expires 5m;
        try_files $uri =404;
    }

    # Never cache HTML, so a new deploy is picked up at once.
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
