<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="pipeline-title pipeline-desc" font-family="IBM Plex Mono, ui-monospace, monospace">
  <title id="pipeline-title">From four producers to one graph to many views</title>
  <desc id="pipeline-desc">Terraform plan JSON, static HCL, Kubernetes objects and a sanitised Terraform state each produce a GraphSnapshot. Every view — infra, adapted, C4, network, IAM, reality — is a projection of that one snapshot, and the exports are renderings of a view.</desc>
  <rect width="760" height="300" fill="#0c0d10"/>

  <text x="24" y="30" fill="#6b7079" font-size="11" letter-spacing="1.5">PRODUCERS</text>
  <text x="300" y="30" fill="#6b7079" font-size="11" letter-spacing="1.5">ONE FORMAT</text>
  <text x="546" y="30" fill="#6b7079" font-size="11" letter-spacing="1.5">VIEWS</text>

  <g fill="#17191f" stroke="#23262d">
    <rect x="24" y="46" width="212" height="38" rx="3"/>
    <rect x="24" y="94" width="212" height="38" rx="3"/>
    <rect x="24" y="142" width="212" height="38" rx="3"/>
    <rect x="24" y="190" width="212" height="38" rx="3"/>
  </g>
  <g fill="#e8eaed" font-size="13">
    <text x="38" y="65">plan.json</text>
    <text x="38" y="113">HCL in the repository</text>
    <text x="38" y="161">Kubernetes objects</text>
    <text x="38" y="209">state, stripped in the CLI</text>
  </g>
  <g fill="#6b7079" font-size="10">
    <text x="38" y="78">your pipeline · pull requests</text>
    <text x="38" y="126">static parse · documentation of main</text>
    <text x="38" y="174">repo YAML · CI render · live cluster</text>
    <text x="38" y="222">what exists, including by hand</text>
  </g>

  <g stroke="#565c66" stroke-width="1" fill="none">
    <path d="M236 65 H272 V132 H300"/>
    <path d="M236 113 H272"/>
    <path d="M236 161 H272"/>
    <path d="M236 209 H272 V138 H300"/>
  </g>
  <path d="M296 128 l8 4 -8 4 z" fill="#565c66"/>

  <rect x="304" y="106" width="180" height="56" rx="3" fill="#1b2431" stroke="#4c8dff"/>
  <text x="394" y="130" fill="#4c8dff" font-size="14" text-anchor="middle">GraphSnapshot</text>
  <text x="394" y="147" fill="#9aa0aa" font-size="10" text-anchor="middle">nodes · edges · attributes · source</text>

  <g stroke="#565c66" stroke-width="1" fill="none">
    <path d="M484 134 H512 V62 H546"/>
    <path d="M512 134 H546"/>
    <path d="M512 134 V206 H546"/>
  </g>

  <g fill="#17191f" stroke="#23262d">
    <rect x="546" y="46" width="190" height="34" rx="3"/>
    <rect x="546" y="117" width="190" height="34" rx="3"/>
    <rect x="546" y="189" width="190" height="34" rx="3"/>
  </g>
  <g fill="#e8eaed" font-size="12">
    <text x="560" y="62">infra · adapted · C4</text>
    <text x="560" y="133">network · IAM · reality</text>
    <text x="560" y="205">SVG · PNG · draw.io · summary</text>
  </g>
  <g fill="#6b7079" font-size="10">
    <text x="560" y="74">the same graph, folded differently</text>
    <text x="560" y="145">Azure-first semantics</text>
    <text x="560" y="217">deterministic renderings of a view</text>
  </g>

  <text x="24" y="270" fill="#9aa0aa" font-size="11">Every producer runs where the access already is. Nothing on this diagram reaches into your cloud.</text>
  <text x="24" y="288" fill="#6b7079" font-size="11">Annotations, policy reports and drift measurements live beside a snapshot — never inside it.</text>
</svg>
