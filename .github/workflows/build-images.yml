# Build & push the production images to the Scaleway container registry + GHCR.
#
# Automates the manual flow in docs/deployment.md ("Building & pushing images").
# Publishes on version tags (v1.2.3 -> 1.2.3, 1.2, latest); workflow_dispatch
# produces a sha-tagged build for testing without touching `latest`.
#
# GHCR (ghcr.io/asteriusit/groundplan-*) is the public home the Helm chart
# defaults to (GP-168); Scaleway keeps serving the compose deployment. GHCR
# auth is the workflow's own GITHUB_TOKEN; Scaleway needs one repository secret:
#   SCW_SECRET_KEY  A Scaleway API secret key with Container Registry write.
#                   (Registry login user is the literal "nologin".)
name: build-images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One run per ref; a newer push supersedes an in-flight build.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # publish to GHCR

env:
  REGISTRY: rg.fr-par.scw.cloud/asteriusit

jobs:
  # Build the catalog snapshot the API image bundles (GP-239).
  #
  # It is produced the only honest way: run the real extraction worker against a
  # throwaway Postgres, then export what it stored. That means the release ships
  # the schemas of the provider versions that were current when it was cut, and
  # an air-gapped install gets the full visual builder with no outbound call.
  #
  # `continue-on-error`: a registry outage must not block a release. The images
  # then ship without a snapshot, the builder falls back to its curated
  # resources and says so — degraded, honestly, rather than not released.
  catalog-snapshot:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: groundplan
          POSTGRES_PASSWORD: groundplan
          POSTGRES_DB: groundplan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U groundplan"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://groundplan:groundplan@localhost:5432/groundplan
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @groundplan/backend migrate

      # One pass per provider, sequential, with the plugin cache warm between
      # them. A large provider is a few hundred megabytes to download.
      - name: Extract provider schemas
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tf-plugins
          CATALOG_TTL_MS: "0"
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          pnpm --filter @groundplan/backend catalog:worker --once

      - name: Export the snapshot
        run: |
          mkdir -p deploy/catalog
          pnpm --filter @groundplan/backend catalog:snapshot \
            --out deploy/catalog/catalog-snapshot.json.gz
          sha256sum deploy/catalog/catalog-snapshot.json.gz | tee deploy/catalog/catalog-snapshot.json.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: catalog-snapshot
          path: deploy/catalog/catalog-snapshot.json.gz*
          retention-days: 30

  build:
    needs: catalog-snapshot
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: apps/backend/Dockerfile
          - image: frontend
            dockerfile: apps/frontend/Dockerfile
          # The catalog extraction worker (GP-236): the one image that ships a
          # `terraform` binary. Scanned by the same Trivy gate as the rest.
          - image: catalog-worker
            dockerfile: apps/backend/Dockerfile.catalog-worker
          # Keycloak 26.7 with the carbon theme baked in (keycloak/Dockerfile).
          - image: keycloak
            dockerfile: keycloak/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # Into the build context, so the API image bundles it (GP-239). Optional
      # on purpose: `continue-on-error` above means the artefact may not exist,
      # and an image without a snapshot is a supported, honest state.
      - name: Fetch the catalog snapshot
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: catalog-snapshot
          path: deploy/catalog

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Scaleway registry
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same tag set pushed to both registries.
      - name: Derive tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/groundplan-${{ matrix.image }}
            ghcr.io/asteriusit/groundplan-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,format=short

      # Build once and load it into the runner's Docker so Trivy can scan the
      # exact image before it is published. linux/amd64 only: the backend image
      # relies on the @resvg/resvg-js linux-x64-gnu prebuild + a frozen-lockfile
      # install, and the deploy target is amd64 (see docs/deployment.md).
      - name: Build image (load for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Gate the release on fixable CRITICAL vulnerabilities. ignore-unfixed
      # keeps unpatchable base-image CVEs from wedging every release; the full
      # table (all severities) is printed to the logs regardless. Tighten to
      # `severity: HIGH,CRITICAL` or set `exit-code: '0'` for report-only.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Cache hit from the build above, so this only uploads layers.
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
