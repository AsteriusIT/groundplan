# Source: groundplan/templates/catalog-worker.yaml
# Egress bound for the worker (GP-236). It needs DNS, the database, and HTTPS to
# the Terraform registry and release host.
#
# Kubernetes NetworkPolicy has no notion of a hostname, so this is a port-level
# bound and not the FQDN allowlist the story asks for. Narrowing it to
# registry.terraform.io and releases.hashicorp.com needs a CNI with FQDN
# policies (Cilium, Calico) or an egress proxy — see docs/install-kubernetes.md.
# Stating that here beats a policy that looks tighter than it is.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: groundplan-catalog-worker
  labels:
    helm.sh/chart: groundplan-0.1.0
    app.kubernetes.io/name: groundplan
    app.kubernetes.io/instance: groundplan
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: catalog-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: groundplan
      app.kubernetes.io/instance: groundplan
      app.kubernetes.io/component: catalog-worker
  policyTypes: ["Ingress", "Egress"]
  # Nothing may reach it: it serves no port.
  ingress: []
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: "0.0.0.0/0"
      ports:
        - protocol: TCP
          port: 443

