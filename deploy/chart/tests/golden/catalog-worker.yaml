# Source: groundplan/templates/catalog-worker.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: groundplan-catalog-worker
  labels:
    helm.sh/chart: groundplan-0.1.0
    app.kubernetes.io/name: groundplan
    app.kubernetes.io/instance: groundplan
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: catalog-worker
spec:
  # Always one. Extraction is single-flight through the database anyway, so a
  # second replica would only ever lose the claim and idle.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: groundplan
      app.kubernetes.io/instance: groundplan
      app.kubernetes.io/component: catalog-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: groundplan
        app.kubernetes.io/instance: groundplan
        app.kubernetes.io/component: catalog-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: catalog-worker
          image: ghcr.io/asteriusit/groundplan-catalog-worker:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          # Deliberately NOT the api's environment: this container has no
          # business holding ENCRYPTION_KEY, an AI key or an OAuth secret. A
          # database and the catalog's own settings is the whole list.
          env:
            - name: NODE_ENV
              value: production
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: groundplan-db
                  key: password
            - name: DATABASE_URL
              value: "postgres://groundplan:$(DB_PASSWORD)@db.example.internal:5432/groundplan"
            - name: CATALOG_REFRESH
              value: "auto"
            - name: CATALOG_PROVIDERS
              value: "hashicorp/azurerm,hashicorp/aws"
            - name: CATALOG_TTL_MS
              value: "43200000"
            - name: CATALOG_REFRESH_INTERVAL_MS
              value: "2700000"
            - name: CATALOG_EXTRACT_TIMEOUT_MS
              value: "900000"
            - name: TF_PLUGIN_CACHE_DIR
              value: /var/cache/terraform-plugins
          volumeMounts:
            - name: plugin-cache
              mountPath: /var/cache/terraform-plugins
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 512Mi
      volumes:
        - name: plugin-cache
          persistentVolumeClaim:
            claimName: groundplan-catalog-plugins
        # Extractions unpack a provider into a temp directory and delete it
        # again; it is scratch, and it is bounded by the extraction timeout.
        - name: tmp
          emptyDir: {}
